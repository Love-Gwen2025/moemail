name: Diagnose Email

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect aggregate mail and auth stats
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_ID: ${{ secrets.DATABASE_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT"
          H="Authorization: Bearer $CF_TOKEN"

          query() {
            local sql="$1"
            echo "-- $sql"
            curl -sS -H "$H" -H "Content-Type: application/json" -X POST "$API/d1/database/$DB_ID/query" \
              -d "$(jq -n --arg sql "$sql" '{sql:$sql}')" | jq -c '{success, errors, rows: [.result[0].results[]?]}'
          }

          echo "== mailboxes =="
          query "SELECT COUNT(*) AS total, SUM(CASE WHEN expires_at > (strftime('%s','now') * 1000) THEN 1 ELSE 0 END) AS active FROM email;"
          query "SELECT MIN(created_at) AS oldest, MAX(created_at) AS newest FROM email;"

          echo "== messages =="
          query "SELECT COUNT(*) AS total, MAX(received_at) AS last_received FROM message;"
          query "SELECT date(received_at/1000, 'unixepoch') AS day, COUNT(*) AS n FROM message GROUP BY day ORDER BY day DESC LIMIT 14;"

          echo "== auth =="
          query "SELECT COUNT(*) AS n FROM user;"
          query "SELECT COUNT(*) AS n FROM account WHERE provider = 'github';"
