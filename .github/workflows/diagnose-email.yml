name: Diagnose Email

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect aggregate mail stats
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_ID: ${{ secrets.DATABASE_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT"
          H="Authorization: Bearer $CF_TOKEN"

          query() {
            local sql="$1"
            echo "-- $sql"
            curl -sS -H "$H" -H "Content-Type: application/json" -X POST "$API/d1/database/$DB_ID/query" \
              -d "$(jq -n --arg sql "$sql" '{sql:$sql}')" | jq -c '{success, errors, rows: [.result[0].results[]?]}'
          }

          echo "== mailbox domains =="
          query "SELECT substr(address, instr(address, '@') + 1) AS domain, COUNT(*) AS n FROM email GROUP BY domain ORDER BY n DESC;"

          echo "== expiry range =="
          query "SELECT MIN(expires_at) AS min_exp, MAX(expires_at) AS max_exp FROM email;"

          echo "== ownership =="
          query "SELECT SUM(CASE WHEN userId IS NULL THEN 1 ELSE 0 END) AS anonymous, SUM(CASE WHEN userId IS NOT NULL THEN 1 ELSE 0 END) AS owned FROM email;"

          echo "== message domains =="
          query "SELECT substr(to_address, instr(to_address, '@') + 1) AS domain, COUNT(*) AS n FROM message GROUP BY domain ORDER BY n DESC LIMIT 10;"
