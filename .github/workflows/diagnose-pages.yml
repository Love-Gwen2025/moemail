name: Diagnose Pages

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Pages projects and deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"

          echo "== account =="
          echo "$CLOUDFLARE_ACCOUNT_ID"

          echo "== projects =="
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API/pages/projects?per_page=50" -o /tmp/projects.json
          jq '{success, errors, projects: [.result[]? | {name, subdomain, domains, source, created_on, latest_deployment_id: .latest_deployment.id, env_var_keys: (.deployment_configs // {} | with_entries(.value = ((.value.env_vars // {}) | keys)))}]}' /tmp/projects.json

          NAME=$(jq -r '.result[]? | select((.domains // []) | index("gwenworks.com")) | .name' /tmp/projects.json | head -1)
          echo "== matched project: $NAME =="

          if [ -n "$NAME" ]; then
            echo "== deployments =="
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$API/pages/projects/$NAME/deployments?per_page=5" \
              | jq '{success, errors, deployments: [.result[]? | {id, created_on, environment, source, deployment_trigger, latest_stage}]}'
          fi
