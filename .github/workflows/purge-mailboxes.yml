name: Purge Mailboxes

on:
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Delete all mailboxes except the kept one
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_ID: ${{ secrets.DATABASE_ID }}
          KEEP: Qyef40dN@gwenworks.com
        run: |
          set -uo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT"
          H="Authorization: Bearer $CF_TOKEN"

          q() {
            curl -sS -H "$H" -H "Content-Type: application/json" -X POST "$API/d1/database/$DB_ID/query" \
              -d "$(jq -n --arg sql "$1" '{sql:$sql}')"
          }

          summarize() {
            jq -c '{success, errors, changes: (.result[0].meta.changes // null), size_after: (.result[0].meta.size_after // null)}'
          }

          echo "== before =="
          q "SELECT COUNT(*) AS emails FROM email;" | jq -c '{success, errors, rows: [.result[0].results[]?]}'
          q "SELECT COUNT(*) AS messages FROM message;" | jq -c '{success, errors, rows: [.result[0].results[]?]}'
          q "SELECT COUNT(*) AS kept FROM email WHERE LOWER(address) = LOWER('$KEEP');" | jq -c '{success, errors, rows: [.result[0].results[]?]}'

          echo "== single-row delete probe =="
          probe=$(q "DELETE FROM email WHERE LOWER(address) <> LOWER('$KEEP') LIMIT 1;")
          echo "$probe" | summarize
          if [ "$(echo "$probe" | jq -r '.success')" != "true" ]; then
            echo "single-row delete failed, stopping"
            exit 0
          fi

          echo "== batch delete =="
          for i in $(seq 1 300); do
            resp=$(q "DELETE FROM email WHERE LOWER(address) <> LOWER('$KEEP') LIMIT 100;")
            line=$(echo "$resp" | summarize)
            echo "batch $i: $line"
            ok=$(echo "$resp" | jq -r '.success')
            changes=$(echo "$resp" | jq -r '.result[0].meta.changes // 0')
            size=$(echo "$resp" | jq -r '.result[0].meta.size_after // 0')
            if [ "$ok" != "true" ]; then
              echo "stopping on error"
              break
            fi
            if [ "$changes" -eq 0 ]; then
              echo "no more rows"
              break
            fi
            if [ "$size" -gt 0 ] && [ "$size" -lt 470000000 ]; then
              echo "size target reached"
              break
            fi
          done

          echo "== after =="
          q "SELECT COUNT(*) AS emails FROM email;" | jq -c '{success, errors, rows: [.result[0].results[]?]}'
          q "SELECT COUNT(*) AS messages FROM message;" | jq -c '{success, errors, rows: [.result[0].results[]?]}'
          q "SELECT COUNT(*) AS kept FROM email WHERE LOWER(address) = LOWER('$KEEP');" | jq -c '{success, errors, rows: [.result[0].results[]?]}'
          q "SELECT COUNT(*) AS kept_messages FROM message WHERE emailId IN (SELECT id FROM email WHERE LOWER(address) = LOWER('$KEEP'));" | jq -c '{success, errors, rows: [.result[0].results[]?]}'
