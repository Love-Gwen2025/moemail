name: Purge Mailboxes

on:
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Preserve kept mailbox and delete all others
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_ID: ${{ secrets.DATABASE_ID }}
          KEEP: Qyef40dN@gwenworks.com
        run: |
          set -uo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT"
          H="Authorization: Bearer $CF_TOKEN"

          q() {
            curl -sS -H "$H" -H "Content-Type: application/json" -X POST "$API/d1/database/$DB_ID/query" \
              -d "$(jq -n --arg sql "$1" '{sql:$sql}')"
          }

          kept_email_count() {
            q "SELECT COUNT(*) AS n FROM email WHERE LOWER(address) = LOWER('$KEEP');" \
              | jq -r '.result[0].results[0].n // 0'
          }

          kept_msg_count() {
            q "SELECT COUNT(*) AS n FROM message WHERE emailId IN (SELECT id FROM email WHERE LOWER(address) = LOWER('$KEEP'));" \
              | jq -r '.result[0].results[0].n // 0'
          }

          kept_email_sig() {
            q "SELECT id || '|' || address || '|' || coalesce(userId,'') || '|' || coalesce(created_at,0) || '|' || coalesce(expires_at,0) AS sig FROM email WHERE LOWER(address) = LOWER('$KEEP');" \
              | jq -r '.result[0].results[0].sig // ""' | sha256sum | cut -d' ' -f1
          }

          kept_msg_sig() {
            q "SELECT group_concat(id, ',') AS ids FROM (SELECT id FROM message WHERE emailId IN (SELECT id FROM email WHERE LOWER(address) = LOWER('$KEEP')) ORDER BY id);" \
              | jq -r '.result[0].results[0].ids // ""' | sha256sum | cut -d' ' -f1
          }

          echo "== db =="
          curl -sS -H "$H" "$API/d1/database/$DB_ID" | jq -c '{success, errors, result: (.result | {name, file_size})}'

          echo "== write probe =="
          probe=$(q "CREATE TABLE IF NOT EXISTS _diag_probe (id TEXT);")
          echo "$probe" | jq -c '{success, errors}'
          if [ "$(echo "$probe" | jq -r '.success')" != "true" ]; then
            echo "WRITE_PROBE_FAILED: upgrade not active yet"
            exit 0
          fi
          q "INSERT INTO _diag_probe (id) VALUES ('diag');" | jq -c '{success, errors}'
          q "DROP TABLE IF EXISTS _diag_probe;" | jq -c '{success, errors}'

          echo "== kept mailbox: before =="
          b_email_count=$(kept_email_count)
          b_msg_count=$(kept_msg_count)
          b_email_sig=$(kept_email_sig)
          b_msg_sig=$(kept_msg_sig)
          echo "KEPT_BEFORE email_count=$b_email_count msg_count=$b_msg_count email_sig=$b_email_sig msg_sig=$b_msg_sig"
          if [ "$b_email_count" -ne 1 ]; then
            echo "KEPT_EMAIL_MISSING: aborting"
            exit 0
          fi

          echo "== delete other mailboxes =="
          for i in $(seq 1 1000); do
            resp=$(q "DELETE FROM email WHERE id IN (SELECT id FROM email WHERE LOWER(address) <> LOWER('$KEEP') ORDER BY LOWER(address) LIMIT 200);")
            ok=$(echo "$resp" | jq -r '.success')
            changes=$(echo "$resp" | jq -r '.result[0].meta.changes // 0')
            size=$(echo "$resp" | jq -r '.result[0].meta.size_after // 0')
            if [ $((i % 10)) -eq 0 ] || [ "$ok" != "true" ] || [ "$changes" -eq 0 ]; then
              echo "batch $i ok=$ok changes=$changes size=$size"
            fi
            [ "$ok" = "true" ] || break
            [ "$changes" -eq 0 ] && break
          done

          echo "== delete orphan messages =="
          for i in $(seq 1 500); do
            resp=$(q "DELETE FROM message WHERE emailId NOT IN (SELECT id FROM email WHERE LOWER(address) = LOWER('$KEEP')) LIMIT 1000;")
            ok=$(echo "$resp" | jq -r '.success')
            changes=$(echo "$resp" | jq -r '.result[0].meta.changes // 0')
            size=$(echo "$resp" | jq -r '.result[0].meta.size_after // 0')
            if [ $((i % 10)) -eq 0 ] || [ "$ok" != "true" ] || [ "$changes" -eq 0 ]; then
              echo "msg batch $i ok=$ok changes=$changes size=$size"
            fi
            [ "$ok" = "true" ] || break
            [ "$changes" -eq 0 ] && break
          done

          echo "== kept mailbox: after =="
          a_email_count=$(kept_email_count)
          a_msg_count=$(kept_msg_count)
          a_email_sig=$(kept_email_sig)
          a_msg_sig=$(kept_msg_sig)
          echo "KEPT_AFTER email_count=$a_email_count msg_count=$a_msg_count email_sig=$a_email_sig msg_sig=$a_msg_sig"
          if [ "$b_email_count" = "$a_email_count" ] && [ "$b_msg_count" = "$a_msg_count" ] && [ "$b_email_sig" = "$a_email_sig" ] && [ "$b_msg_sig" = "$a_msg_sig" ]; then
            echo "KEPT_OK=true"
          else
            echo "KEPT_OK=false"
          fi

          echo "== totals =="
          q "SELECT COUNT(*) AS emails FROM email;" | jq -c '{success, errors, rows: [.result[0].results[]?]}'
          q "SELECT COUNT(*) AS messages FROM message;" | jq -c '{success, errors, rows: [.result[0].results[]?]}'
          curl -sS -H "$H" "$API/d1/database/$DB_ID" | jq -c '{success, errors, result: (.result | {name, file_size})}'
