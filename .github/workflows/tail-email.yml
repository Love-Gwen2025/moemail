name: Tail Email Worker

on:
  workflow_dispatch:

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tail email-receiver-worker for 5 minutes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          timeout 300 pnpm dlx wrangler tail email-receiver-worker --format json \
            | jq -c 'select(((.logs // []) | length) > 0 or ((.exceptions // []) | length) > 0) | {outcome, exceptions: [.exceptions[]? | {name, message: ((.message // "") | split("\n")[0] | .[0:160])}], logs: [.logs[]? | {level, msg: ((.message[0] // "") | tostring)}]}'
          echo "tail window finished"
